syntax = "proto3";

option go_package = "github.com/vandad1901/p3s/packages/go/gen/protobuf/userpb/v1;userpb";
package userpb.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

service UserService {
  rpc Register (RegisterRequest) returns (RegisterResponse)
  {
    option (google.api.http) = {
      post: "/v1/auth/register"
      body: "*"
    };
  };
  rpc Login (LoginRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/v1/auth/login"
      body: "*"
    };
  };
  rpc RefreshJWT (RefreshJWTRequest) returns (RefreshJWTResponse) {
    option (google.api.http) = {
      post: "/v1/auth/refresh"
      body: "*"
    };
  };
}

message User {
  int64  id       = 1;
  string username = 2;
  string email    = 3;
}

enum SessionStatus {
  SESSION_STATUS_UNSPECIFIED = 0;
  SESSION_STATUS_ACTIVE      = 1;
  SESSION_STATUS_REVOKED     = 2;
}

message AuthSessionResponse {
  int64 session_id = 1;

  string                    jwt               = 2;
  string                    refresh_token     = 3;
  google.protobuf.Timestamp access_expires_at = 4;
}

message RegisterRequest {
  User   user     = 1;
  string password = 2;
}

message RegisterResponse {
  AuthSessionResponse session = 1;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  AuthSessionResponse session = 1;
}

message RefreshJWTRequest {
  int64  user_id       = 1;
  int64  session_id    = 2;
  string refresh_token = 3;
}

message RefreshJWTResponse {
  string jwt = 1;
}
