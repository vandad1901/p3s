syntax = "proto3";

option go_package = "github.com/vandad1901/purpl3shadow/packages/go/protobuf/userpb;userpb";
package userpb.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

service UserService {
  rpc Register (RegisterRequest) returns (RegisterResponse)
  {
    option (google.api.http) = {
      post: "/v1/auth/register"
      body: "*"
    };
  };
  rpc Login (LoginRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/v1/auth/login"
      body: "*"
    };
  };
  rpc RefreshJWT (RefreshJWTRequest) returns (RefreshJWTResponse) {
    option (google.api.http) = {
      post: "/v1/auth/refresh"
      body: "*"
    };
  };
  rpc GetUser (GetUserRequest) returns (GetUserResponse) {
    option (google.api.http) = {
      get: "/v1/users/{id}"
    };
  };
}

message User {
  int64  id       = 1;
  string username = 2;
  string email    = 3;
}

message AuthSession {
  int64 user_id = 1;

  // Unique session identifier (enables revocation, tracking, multi-device support)
  string session_id = 2;

  // Access token (JWT)
  string jwt = 3;

  // Refresh token (used to rotate session)
  string refresh_token = 4;

  // Lifecycle timestamps
  google.protobuf.Timestamp issued_at          = 5;
  google.protobuf.Timestamp expires_at         = 6;
  google.protobuf.Timestamp refresh_expires_at = 7;

  // Optional session metadata (useful for security + debugging)
  string device_id  = 8;
  string ip_address = 9;
  string user_agent = 10;

  // Session state (for revocation / logout-all / security control)
  SessionStatus status = 11;
}

enum SessionStatus {
  SESSION_STATUS_UNSPECIFIED = 0;
  SESSION_STATUS_ACTIVE      = 1;
  SESSION_STATUS_REVOKED     = 2;
}

message RegisterRequest {
  User   user     = 1;
  string password = 2;
}

message RegisterResponse {
  AuthSession session = 1;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  AuthSession session = 1;
}

message RefreshJWTRequest {
  string refresh_token = 1;
}

message RefreshJWTResponse {
  AuthSession session = 1;
}

message GetUserRequest {
  int64 id = 1;
}

message GetUserResponse {
  User user = 1;
}