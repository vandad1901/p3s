version: v2

inputs:
  - directory: contracts

plugins:
  - remote: buf.build/protocolbuffers/go
    out: packages/go/gen/protobuf
    opt: [paths=source_relative]

  - remote: buf.build/grpc/go
    out: packages/go/gen/protobuf
    opt: [paths=source_relative]

  - remote: buf.build/community/stephenh-ts-proto
    out: packages/web/gen
    opt:
      - onlyTypes=true
      - emitImportedFiles=false