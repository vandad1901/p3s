name: p3s

services:
  auth:
    build:
      context: ../..
      dockerfile: ./apps/auth/dockerfile
    restart: unless-stopped
    environment:
      - AUTH_PG_HOST=pg
      - APP_ENV=development
    env_file:
      - ../../apps/auth/.env
    volumes:
      - ../../apps/auth/jwt_private_key.pem:/app/jwt_private_key.pem
    healthcheck:
      test: ["CMD","/app/healthcheck"]
      interval: 30s
    depends_on:
      - pg
  api:
    build:
      context: ../..
      dockerfile: ./apps/api/dockerfile
    restart: unless-stopped
    environment:
      - API_PG_HOST=pg
      - APP_ENV=development
    env_file:
      - ../../apps/api/.env
    healthcheck:
      test: ["CMD","/app/healthcheck"]
      interval: 30s
    depends_on:
      - auth
      - pg
  upload:
    build:
      context: ../..
      dockerfile: ./apps/upload/dockerfile
    restart: unless-stopped
    environment:
      - API_PG_HOST=pg
      - S3_ENDPOINT=http://silo:${S3_PORT}
      - RMQ_ENDPOINT=amqp://rmq-user:rmq-password@rmq:5672
      - AUTH_JWKS_ADDRESS=http://auth:50151/.well-known/jwks.json
    env_file:
      - ../../apps/upload/.env
    depends_on:
      - auth
      - silo
      - rmq
  media:
    build:
      context: ../..
      dockerfile: ./apps/media/dockerfile
    restart: unless-stopped
    environment:
      - API_PG_HOST=pg
      - S3_ENDPOINT=http://silo:${S3_PORT}
      - RMQ_ENDPOINT=amqp://rmq-user:rmq-password@rmq:5672
    env_file:
      - ../../apps/media/.env
    depends_on:
      - pg
      - silo
      - rmq
      - auth
