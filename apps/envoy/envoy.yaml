static_resources:
  listeners:
    - name: http_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080

      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: grpc_json

                route_config:
                  name: routes
                  virtual_hosts:
                    - name: services
                      domains: ["*"]
                      routes:
                        - match:
                            path: "/.well-known/jwks.json"
                          route:
                            cluster: auth_jwks

                        - match:
                            prefix: "/auth/"
                          route:
                            cluster: auth_grpc

                        - match:
                            prefix: "/api/"
                          route:
                            cluster: api_grpc

                        - match:
                            prefix: "/upload/"
                          route:
                            cluster: upload_http

                http_filters:
                  - name: envoy.filters.http.grpc_json_transcoder
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_json_transcoder.v3.GrpcJsonTranscoder
                      proto_descriptor: /etc/envoy/descriptor.pb
                      services:
                        - auth.authnpb.v1.AuthnService
                        - api.postpb.v1.PostService
                      match_incoming_request_route: true
                      convert_grpc_status: true

                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: auth_grpc
      connect_timeout: 1s
      type: logical_dns
      http2_protocol_options: {}
      load_assignment:
        cluster_name: auth_grpc
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: auth
                      port_value: 50051
    - name: auth_jwks
      connect_timeout: 1s
      type: logical_dns
      http2_protocol_options: {}
      load_assignment:
        cluster_name: auth_jwks
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: auth
                      port_value: 50151
    - name: api_grpc
      connect_timeout: 1s
      type: logical_dns
      http2_protocol_options: {}
      load_assignment:
        cluster_name: api_grpc
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: api
                      port_value: 50052
    - name: upload_http
      connect_timeout: 1s
      type: logical_dns
      load_assignment:
        cluster_name: upload_http
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: upload
                      port_value: 50153
